<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CampusKart | Create Account</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            color: #172033;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            background: #101b35;
            color: white;
            padding: 18px 7%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            flex-wrap: wrap;
        }

        .logo {
            font-size: 25px;
            font-weight: bold;
            color: white;
            text-decoration: none;
        }

        .logo span {
            color: #2dd4bf;
        }

        nav {
            display: flex;
            gap: 22px;
            flex-wrap: wrap;
        }

        nav a {
            color: #dce5f5;
            text-decoration: none;
            font-size: 14px;
        }

        nav a:hover,
        nav a.active {
            color: #2dd4bf;
        }

        main {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 18px;
        }

        .signup-container {
            width: 100%;
            max-width: 500px;
        }

        .welcome-text {
            text-align: center;
            margin-bottom: 25px;
        }

        .welcome-icon {
            width: 68px;
            height: 68px;
            background: #ccfbf1;
            border-radius: 18px;
            display: grid;
            place-items: center;
            font-size: 32px;
            margin: 0 auto 17px;
        }

        .welcome-text h1 {
            font-size: 29px;
            margin-bottom: 9px;
        }

        .welcome-text p {
            color: #64748b;
            font-size: 14px;
            line-height: 1.6;
        }

        .signup-card {
            background: white;
            padding: 30px;
            border-radius: 16px;
            border: 1px solid #e5eaf2;
            box-shadow: 0 10px 35px #101b3510;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .form-group {
            margin-bottom: 19px;
        }

        .form-group label {
            display: block;
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 8px;
        }

        .required {
            color: #dc2626;
        }

        .form-group input,
        .form-group select {
            width: 100%;
            padding: 13px 12px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 14px;
            background: white;
            outline: none;
        }

        .form-group input:focus,
        .form-group select:focus {
            border-color: #0f766e;
            box-shadow: 0 0 0 3px #0f766e18;
        }

        .password-wrapper {
            position: relative;
        }

        .password-wrapper input {
            padding-right: 65px;
        }

        .show-password {
            position: absolute;
            right: 11px;
            top: 50%;
            transform: translateY(-50%);
            border: none;
            background: none;
            color: #0f766e;
            font-weight: bold;
            cursor: pointer;
            font-size: 12px;
        }

        .hostel-fields {
            display: none;
        }

        .hostel-fields.show {
            display: block;
        }

        .terms {
            display: flex;
            align-items: flex-start;
            gap: 9px;
            margin-bottom: 21px;
            color: #475569;
            font-size: 13px;
            line-height: 1.6;
        }

        .terms input {
            margin-top: 4px;
            accent-color: #0f766e;
        }

        .terms a,
        .login-text a {
            color: #0f766e;
            text-decoration: none;
            font-weight: bold;
        }

        .signup-btn {
            width: 100%;
            padding: 14px;
            background: #0f766e;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
        }

        .signup-btn:hover {
            background: #115e59;
        }

        .signup-btn:disabled {
            opacity: 0.7;
            cursor: not-allowed;
        }

        .login-text {
            text-align: center;
            margin-top: 22px;
            font-size: 14px;
            color: #64748b;
        }

        .message {
            display: none;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 18px;
            font-size: 13px;
            line-height: 1.5;
        }

        .message.error {
            display: block;
            color: #991b1b;
            background: #fee2e2;
        }

        .message.success {
            display: block;
            color: #166534;
            background: #dcfce7;
        }

        footer {
            background: #101b35;
            color: #cbd5e1;
            text-align: center;
            padding: 22px 15px;
            font-size: 13px;
        }

        @media (max-width: 480px) {
            header {
                padding: 17px 5%;
            }

            nav {
                gap: 13px;
            }

            .signup-card {
                padding: 23px 18px;
            }

            .form-row {
                grid-template-columns: 1fr;
                gap: 0;
            }

            .welcome-text h1 {
                font-size: 25px;
            }
        }
    </style>
</head>

<body>

    <header>
        <a href="index.html" class="logo">
            Campus<span>Kart</span>
        </a>

        <nav>
            <a href="index.html">Home</a>
            <a href="browse.html">Browse</a>
            <a href="sell.html">Sell</a>
            <a href="dashboard.html">Dashboard</a>
            <a href="login.html">Login</a>
        </nav>
    </header>

    <main>
        <div class="signup-container">

            <div class="welcome-text">
                <div class="welcome-icon">🎓</div>

                <h1>Join CampusKart!</h1>

                <p>
                    Create your student account and start buying
                    and selling within your campus community.
                </p>
            </div>

            <div class="signup-card">

                <div
                    id="message"
                    class="message"
                    role="status"
                    aria-live="polite">
                </div>

                <form id="signupForm">

                    <div class="form-row">

                        <div class="form-group">
                            <label for="fullName">Full Name <span class="required">*</span></label>

                            <input
                                type="text"
                                id="fullName"
                                name="fullName"
                                placeholder="Your full name"
                                autocomplete="name"
                                minlength="2"
                                required>
                        </div>

                        <div class="form-group">
                            <label for="college">College Name <span class="required">*</span></label>

                            <input
                                type="text"
                                id="college"
                                name="college"
                                placeholder="Your college"
                                minlength="2"
                                required>
                        </div>

                    </div>

                    <div class="form-group">
                        <label for="email">Enter your Email Address <span class="required">*</span></label>

                        <input
                            type="email"
                            id="email"
                            name="email"
                            placeholder="xyz@example.com"
                            autocomplete="email"
                            required>
                    </div>

                    <div class="form-group">
                        <label for="phone">Enter Your Phone Number <span class="required">*</span></label>

                        <input
                            type="tel"
                            id="phone"
                            name="phone"
                            placeholder="Enter 10-digit number"
                            maxlength="10"
                            minlength="10"
                            pattern="[0-9]{10}"
                            inputmode="numeric"
                            autocomplete="tel"
                            title="Please enter exactly 10 digits."
                            required>
                    </div>

                    <div class="form-group">
                        <label for="studentId">College ID <span class="required">*</span></label>

                        <input
                            type="text"
                            id="studentId"
                            name="studentId"
                            placeholder="Apni college ID daalo"
                            required>
                    </div>

                    <div class="form-group">
                        <label for="staysInHostel">Kya aap hostel mein rehte ho? <span class="required">*</span></label>

                        <select id="staysInHostel" name="staysInHostel" required>
                            <option value="">Select karein</option>
                            <option value="yes">Haan, hostel mein</option>
                            <option value="no">Nahi, day scholar / ghar se</option>
                        </select>
                    </div>

                    <div id="hostelFields" class="hostel-fields">
                        <div class="form-row">
                            <div class="form-group">
                                <label for="hostelName">Hostel Name <span class="required">*</span></label>

                                <input
                                    type="text"
                                    id="hostelName"
                                    name="hostelName"
                                    placeholder="e.g. Boys Hostel A">
                            </div>

                            <div class="form-group">
                                <label for="roomNo">Room Number <span class="required">*</span></label>

                                <input
                                    type="text"
                                    id="roomNo"
                                    name="roomNo"
                                    placeholder="e.g. 204"
                                    maxlength="10">
                            </div>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="password">Create Password <span class="required">*</span></label>

                        <div class="password-wrapper">
                            <input
                                type="password"
                                id="password"
                                name="password"
                                placeholder="At least 8 characters"
                                autocomplete="new-password"
                                minlength="8"
                                required>

                            <button
                                type="button"
                                class="show-password"
                                data-target="password">
                                Show
                            </button>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="confirmPassword">Confirm Password <span class="required">*</span></label>

                        <div class="password-wrapper">
                            <input
                                type="password"
                                id="confirmPassword"
                                name="confirmPassword"
                                placeholder="Re-enter your password"
                                autocomplete="new-password"
                                minlength="8"
                                required>

                            <button
                                type="button"
                                class="show-password"
                                data-target="confirmPassword">
                                Show
                            </button>
                        </div>
                    </div>

                    <label class="terms">
                        <input type="checkbox" id="terms" required>

                        <span>
                            I agree to the CampusKart terms and conditions
                            and understand the community guidelines.
                        </span>
                    </label>

                    <button type="submit" class="signup-btn">
                        Create My Account →
                    </button>

                </form>

                <p class="login-text">
                    Already have an account?
                    <a href="login.html">Login here</a>
                </p>

            </div>
        </div>
    </main>

    <footer>
        <p>
            © 2026 CampusKart | Buy. Sell. Connect. Right on Campus.
        </p>
    </footer>

    <script type="module">
        import {
            initializeApp,
            getApps,
            getApp
        } from "https://www.gstatic.com/firebasejs/12.0.0/firebase-app.js";

        import {
            getAuth,
            createUserWithEmailAndPassword,
            updateProfile
        } from "https://www.gstatic.com/firebasejs/12.0.0/firebase-auth.js";

        import {
            getFirestore,
            doc,
            setDoc,
            serverTimestamp
        } from "https://www.gstatic.com/firebasejs/12.0.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAo5yUfQp1V5OoPW1o21UJne9I0Zz9ApLU",
            authDomain: "campus-cart-62492.firebaseapp.com",
            projectId: "campus-cart-62492",
            storageBucket: "campus-cart-62492.firebasestorage.app",
            messagingSenderId: "182996728543",
            appId: "1:182996728543:web:9fc39d8abed5983f37c76a",
            measurementId: "G-NN86N2NE52"
        };

        const app = getApps().length ? getApp() : initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        const signupForm = document.getElementById("signupForm");
        const message = document.getElementById("message");
        const phoneInput = document.getElementById("phone");
        const staysInHostel = document.getElementById("staysInHostel");
        const hostelFields = document.getElementById("hostelFields");
        const hostelName = document.getElementById("hostelName");
        const roomNo = document.getElementById("roomNo");

        function showMessage(text, type) {
            message.textContent = text;
            message.className = "message " + type;
        }

        // Phone: only digits, max 10
        phoneInput.addEventListener("input", function () {
            this.value = this.value.replace(/\D/g, "").slice(0, 10);
        });

        // Show hostel fields only when student lives in hostel
        staysInHostel.addEventListener("change", function () {
            const isHostel = this.value === "yes";
            hostelFields.classList.toggle("show", isHostel);
            hostelName.required = isHostel;
            roomNo.required = isHostel;

            if (!isHostel) {
                hostelName.value = "";
                roomNo.value = "";
            }
        });

        // Show / Hide password buttons
        document.querySelectorAll(".show-password").forEach(function (button) {
            button.addEventListener("click", function () {
                const input = document.getElementById(button.dataset.target);

                if (input.type === "password") {
                    input.type = "text";
                    button.textContent = "Hide";
                } else {
                    input.type = "password";
                    button.textContent = "Show";
                }
            });
        });

        signupForm.addEventListener("submit", async function (event) {
            event.preventDefault();

            const fullName = document.getElementById("fullName").value.trim();
            const college = document.getElementById("college").value.trim();
            const email = document.getElementById("email").value.trim();
            const phone = phoneInput.value;
            const studentId = document.getElementById("studentId").value.trim();
            const livesInHostel = staysInHostel.value === "yes";
            const hostel = hostelName.value.trim();
            const room = roomNo.value.trim();
            const password = document.getElementById("password").value;
            const confirmPassword = document.getElementById("confirmPassword").value;

            if (fullName.length < 2) {
                showMessage("Please enter your full name.", "error");
                return;
            }

            if (college.length < 2) {
                showMessage("Please enter your college name.", "error");
                return;
            }

            if (!/^[0-9]{10}$/.test(phone)) {
                showMessage("Please enter exactly 10 digits for your phone number.", "error");
                phoneInput.focus();
                return;
            }

            if (studentId.length < 1) {
                showMessage("Please enter your college ID.", "error");
                return;
            }

            if (!staysInHostel.value) {
                showMessage("Please select whether you stay in a hostel.", "error");
                return;
            }

            if (livesInHostel && (hostel.length < 2 || room.length < 1)) {
                showMessage("Please enter your hostel name and room number.", "error");
                return;
            }

            if (password.length < 8) {
                showMessage("Password must contain at least 8 characters.", "error");
                return;
            }

            if (password !== confirmPassword) {
                showMessage("Passwords do not match.", "error");
                return;
            }

            if (!document.getElementById("terms").checked) {
                showMessage("Please agree to the terms first.", "error");
                return;
            }

            const submitButton = signupForm.querySelector('button[type="submit"]');
            submitButton.disabled = true;
            submitButton.textContent = "Creating account...";

            try {
                const userCredential = await createUserWithEmailAndPassword(auth, email, password);

                await updateProfile(userCredential.user, {
                    displayName: fullName
                });

                const profilePayload = {
                    uid: userCredential.user.uid,
                    name: fullName,
                    fullName: fullName,
                    campus: college,
                    college: college,
                    email: email,
                    phone: phone,
                    studentId: studentId,
                    livesInHostel: livesInHostel,
                    hostel: livesInHostel ? hostel : null,
                    roomNo: livesInHostel ? room : null
                };

                try {
                    localStorage.setItem("campuskart_profile_" + userCredential.user.uid, JSON.stringify(profilePayload));
                    localStorage.setItem("campuskart_last_profile", JSON.stringify(profilePayload));
                } catch (_) {}

                // Save college, studentId, hostel and room details to
                // Firestore so Dashboard profile completeness & WhatsApp contact work immediately.
                try {
                    await setDoc(
                        doc(db, "users", userCredential.user.uid),
                        {
                            ...profilePayload,
                            createdAt: serverTimestamp(),
                            updatedAt: serverTimestamp()
                        },
                        { merge: true }
                    );
                } catch (profileErr) {
                    console.warn("Could not save extra profile fields to Firestore:", profileErr);
                }

                showMessage("Account created successfully! Opening login page...", "success");

                signupForm.reset();
                hostelFields.classList.remove("show");

                setTimeout(function () {
                    window.location.href = "login.html";
                }, 1500);

            } catch (error) {
                let errorMessage = "Signup failed. Please try again.";

                if (error.code === "auth/email-already-in-use") {
                    errorMessage = "This email already has an account. Please log in.";
                } else if (error.code === "auth/invalid-email") {
                    errorMessage = "Please enter a valid email address.";
                } else if (error.code === "auth/weak-password") {
                    errorMessage = "Please choose a stronger password.";
                } else if (error.code === "auth/network-request-failed") {
                    errorMessage = "Network error. Check your internet connection.";
                } else if (error.code === "auth/operation-not-allowed") {
                    errorMessage = "Email/password signup is not enabled in Firebase.";
                }

                showMessage(errorMessage, "error");

            } finally {
                submitButton.disabled = false;
                submitButton.textContent = "Create My Account →";
            }
        });
    </script>

</body>
</html>
