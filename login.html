<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CampusKart | Login</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            color: #172033;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Navbar */
        header {
            background: #101b35;
            color: white;
            padding: 18px 7%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            flex-wrap: wrap;
        }

        .logo {
            font-size: 25px;
            font-weight: bold;
            color: white;
            text-decoration: none;
        }

        .logo span {
            color: #2dd4bf;
        }

        nav {
            display: flex;
            gap: 22px;
            flex-wrap: wrap;
        }

        nav a {
            color: #dce5f5;
            text-decoration: none;
            font-size: 14px;
        }

        nav a:hover,
        nav a.active {
            color: #2dd4bf;
        }

        /* Main login section */
        main {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 45px 18px;
        }

        .login-container {
            width: 100%;
            max-width: 440px;
        }

        .welcome-text {
            text-align: center;
            margin-bottom: 25px;
        }

        .welcome-icon {
            width: 68px;
            height: 68px;
            background: #ccfbf1;
            border-radius: 18px;
            display: grid;
            place-items: center;
            font-size: 32px;
            margin: 0 auto 18px;
        }

        .welcome-text h1 {
            font-size: 30px;
            margin-bottom: 10px;
        }

        .welcome-text p {
            color: #64748b;
            font-size: 14px;
            line-height: 1.6;
        }

        .login-card {
            background: white;
            padding: 32px;
            border-radius: 16px;
            border: 1px solid #e5eaf2;
            box-shadow: 0 10px 35px #101b3510;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 9px;
        }

        .form-group input {
            width: 100%;
            padding: 13px 14px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 14px;
            outline: none;
            background: white;
        }

        .form-group input:focus {
            border-color: #0f766e;
            box-shadow: 0 0 0 3px #0f766e18;
        }

        .password-wrapper {
            position: relative;
        }

        .password-wrapper input {
            padding-right: 65px;
        }

        .show-password {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            border: none;
            background: none;
            color: #0f766e;
            cursor: pointer;
            font-size: 12px;
            font-weight: bold;
        }

        .form-options {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
            font-size: 13px;
            margin: 4px 0 23px;
        }

        .remember {
            display: flex;
            align-items: center;
            gap: 7px;
            color: #475569;
        }

        .remember input {
            accent-color: #0f766e;
        }

        .form-options a,
        .signup-text a {
            color: #0f766e;
            font-weight: bold;
            text-decoration: none;
        }

        .form-options a:hover,
        .signup-text a:hover {
            text-decoration: underline;
        }

        .forgot-link {
            background: none;
            border: none;
            color: #0f766e;
            font-weight: bold;
            font-size: 13px;
            cursor: pointer;
            padding: 0;
        }

        .forgot-link:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .login-btn {
            width: 100%;
            padding: 14px;
            background: #0f766e;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
        }

        .login-btn:hover {
            background: #115e59;
        }

        .login-btn:disabled {
            opacity: 0.7;
            cursor: not-allowed;
        }

        .signup-text {
            text-align: center;
            margin-top: 23px;
            font-size: 14px;
            color: #64748b;
        }

        /* Message box */
        .message {
            display: none;
            padding: 12px;
            border-radius: 8px;
            margin-top: 18px;
            font-size: 13px;
            line-height: 1.5;
        }

        .message.error {
            display: block;
            color: #991b1b;
            background: #fee2e2;
        }

        .message.success {
            display: block;
            color: #166534;
            background: #dcfce7;
        }

        .message.info {
            display: block;
            color: #115e59;
            background: #f0fdfa;
            border: 1px solid #ccfbf1;
        }

        footer {
            background: #101b35;
            color: #cbd5e1;
            text-align: center;
            padding: 22px 15px;
            font-size: 13px;
        }

        @media (max-width: 480px) {
            header {
                padding: 17px 5%;
            }

            nav {
                gap: 13px;
            }

            .login-card {
                padding: 23px 19px;
            }

            .welcome-text h1 {
                font-size: 26px;
            }
        }
    </style>
</head>

<body>

    <header>
        <a href="index.html" class="logo">
            Campus<span>Kart</span>
        </a>

        <nav>
            <a href="index.html">Home</a>
            <a href="browse.html">Browse</a>
            <a href="sell.html">Sell</a>
            <a href="dashboard.html">Dashboard</a>
            <a href="login.html" class="active">Login</a>
        </nav>
    </header>

    <main>
        <div class="login-container">

            <div class="welcome-text">
                <div class="welcome-icon">🎓</div>
                <h1>Welcome Back!</h1>
                <p>
                    Login to your CampusKart account and
                    connect with your campus community.
                </p>
            </div>

            <div class="login-card">

                <form id="loginForm">

                    <div class="form-group">
                        <label for="email">Enter Your Email</label>

                        <input
                            type="email"
                            id="email"
                            name="email"
                            placeholder="you@example.com"
                            autocomplete="email"
                            required
                        >
                    </div>

                    <div class="form-group">
                        <label for="password">Password</label>

                        <div class="password-wrapper">
                            <input
                                type="password"
                                id="password"
                                name="password"
                                placeholder="Enter your password"
                                autocomplete="current-password"
                                required
                                minlength="6"
                            >

                            <button
                                type="button"
                                class="show-password"
                                id="togglePassword"
                            >
                                Show
                            </button>
                        </div>
                    </div>

                    <div class="form-options">

                        <label class="remember">
                            <input type="checkbox" id="remember">
                            Remember me
                        </label>

                        <button type="button" class="forgot-link" id="forgotPassword">
                            Forgot password?
                        </button>

                    </div>

                    <button type="submit" class="login-btn" id="loginBtn">
                        Login to CampusKart →
                    </button>

                </form>

                <div id="message" class="message" role="status" aria-live="polite"></div>

                <p class="signup-text">
                    Don't have an account?
                    <a href="signup.html">Create Account</a>
                </p>

            </div>
        </div>
    </main>

    <footer>
        <p>© 2026 CampusKart | Buy. Sell. Connect. Right on Campus.</p>
    </footer>

    <!-- JAVASCRIPT -->
    <script type="module">
        import { initializeApp, getApps, getApp } from "https://www.gstatic.com/firebasejs/12.0.0/firebase-app.js";

        import {
            getAuth,
            signInWithEmailAndPassword,
            sendPasswordResetEmail
        } from "https://www.gstatic.com/firebasejs/12.0.0/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAo5yUfQp1V5OoPW1o21UJne9I0Zz9ApLU",
            authDomain: "campus-cart-62492.firebaseapp.com",
            projectId: "campus-cart-62492",
            storageBucket: "campus-cart-62492.firebasestorage.app",
            messagingSenderId: "182996728543",
            appId: "1:182996728543:web:9fc39d8abed5983f37c76a",
            measurementId: "G-NN86N2NE52"
        };

        const app = getApps().length ? getApp() : initializeApp(firebaseConfig);
        const auth = getAuth(app);

        const loginForm = document.getElementById("loginForm");
        const loginBtn = document.getElementById("loginBtn");
        const emailInput = document.getElementById("email");
        const passwordInput = document.getElementById("password");
        const togglePassword = document.getElementById("togglePassword");
        const forgotPassword = document.getElementById("forgotPassword");
        const message = document.getElementById("message");

        function showMessage(text, type) {
            message.textContent = text;
            message.className = "message " + type;
        }

        // Show / Hide password
        togglePassword.addEventListener("click", function () {
            if (passwordInput.type === "password") {
                passwordInput.type = "text";
                togglePassword.textContent = "Hide";
            } else {
                passwordInput.type = "password";
                togglePassword.textContent = "Show";
            }
        });

        // Login
        loginForm.addEventListener("submit", async function (e) {
            e.preventDefault();

            const email = emailInput.value.trim();
            const password = passwordInput.value;

            loginBtn.disabled = true;
            loginBtn.textContent = "Logging in...";
            showMessage("Logging in...", "info");

            try {
                await signInWithEmailAndPassword(auth, email, password);

                showMessage("Login successful!", "success");
                window.location.href = "dashboard.html";

            } catch (error) {
                console.error("Login error code:", error.code);

                let errorMessage = "Login failed. Please try again.";

                if (
                    error.code === "auth/invalid-credential" ||
                    error.code === "auth/wrong-password" ||
                    error.code === "auth/user-not-found"
                ) {
                    errorMessage = "Incorrect email or password.";
                } else if (error.code === "auth/invalid-email") {
                    errorMessage = "Please enter a valid email address.";
                } else if (error.code === "auth/too-many-requests") {
                    errorMessage = "Too many attempts. Thodi der baad try karein, ya password reset karein.";
                } else if (error.code === "auth/network-request-failed") {
                    errorMessage = "Network error. Check your internet connection.";
                }

                showMessage(errorMessage, "error");

                loginBtn.disabled = false;
                loginBtn.textContent = "Login to CampusKart →";
            }
        });

        // Forgot password: reset link email par bhejna
        forgotPassword.addEventListener("click", async function () {
            const email = emailInput.value.trim();

            if (!email) {
                showMessage("Pehle apna email upar likhein, phir Forgot password par click karein.", "error");
                emailInput.focus();
                return;
            }

            if (!emailInput.checkValidity()) {
                showMessage("Please enter a valid email address.", "error");
                emailInput.focus();
                return;
            }

            forgotPassword.disabled = true;
            showMessage("Reset link bheja ja raha hai...", "info");

            try {
                await sendPasswordResetEmail(auth, email);

                showMessage(
                    "Password reset link aapke email par bhej diya gaya hai. " +
                    "Inbox ke saath Spam/Junk bhi check karein. Link khol kar naya password set karein, " +
                    "phir yahin se login karein.",
                    "success"
                );

            } catch (error) {
                console.error("Password reset error code:", error.code);

                let errorMessage = "Reset link nahi bheja ja saka. Dobara try karein.";

                if (error.code === "auth/invalid-email") {
                    errorMessage = "Please enter a valid email address.";
                } else if (error.code === "auth/user-not-found") {
                    errorMessage = "Is email se koi account nahi mila. Please Create Account karein.";
                } else if (error.code === "auth/too-many-requests") {
                    errorMessage = "Bahut zyada requests aa gayi hain. Thodi der baad try karein.";
                } else if (error.code === "auth/network-request-failed") {
                    errorMessage = "Network error. Check your internet connection.";
                }

                showMessage(errorMessage, "error");

            } finally {
                forgotPassword.disabled = false;
            }
        });
    </script>

</body>
</html>
